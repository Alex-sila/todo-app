<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои задачи</title>
  <style>
    /* ================= СТИЛИ (CSS) ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex; justify-content: center; padding: 40px 20px;
    }
    .app {
      background: #fff; width: 100%; max-width: 560px;
      border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden; display: flex; flex-direction: column;
    }
    header { padding: 28px 28px 20px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    h1 { font-size: 26px; margin-bottom: 4px; }
    .subtitle { font-size: 14px; opacity: 0.85; }
    .add-form { display: flex; gap: 10px; padding: 20px 28px; border-bottom: 1px solid #e2e8f0; }
    #taskInput { flex: 1; padding: 12px 16px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; }
    #taskInput:focus { border-color: #667eea; }
    .add-form button {
      padding: 12px 22px; font-size: 15px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2); border: none;
      border-radius: 10px; cursor: pointer; transition: transform 0.15s;
    }
    .add-form button:hover { transform: translateY(-2px); }
    .filters { display: flex; gap: 8px; padding: 16px 28px; background: #f7fafc; border-bottom: 1px solid #e2e8f0; }
    .filter-btn {
      padding: 8px 16px; font-size: 14px; font-weight: 500; color: #4a5568;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;
    }
    .filter-btn.active { background: #667eea; color: #fff; border-color: #667eea; }
    .task-list { list-style: none; padding: 8px 0; flex: 1; max-height: 400px; overflow-y: auto; }
    .task-item { display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid #f0f0f0; }
    .task-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #667eea; }
    .task-item span { flex: 1; font-size: 15px; color: #2d3748; word-break: break-word; }
    .task-item.done span { text-decoration: line-through; color: #a0aec0; }
    .task-item .delete-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #cbd5e0; padding: 4px 8px; border-radius: 6px; }
    .task-item .delete-btn:hover { color: #e53e3e; background: #fff5f5; }
    .empty { padding: 40px 28px; text-align: center; color: #a0aec0; }
    .empty span { font-size: 48px; display: block; margin-bottom: 12px; }
    .empty.hidden { display: none; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; background: #f7fafc; border-top: 1px solid #e2e8f0; font-size: 14px; color: #4a5568; }
    .clear-btn { background: none; border: none; color: #e53e3e; font-size: 14px; cursor: pointer; font-weight: 500; }
    .clear-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>📋 Мои задачи</h1>
      <p class="subtitle">Планируй день продуктивно</p>
    </header>

    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="done">Выполненные</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty" id="emptyState">
      <span>🎉</span>
      <p>Задач пока нет. Добавь первую!</p>
    </div>

    <footer>
      <span id="counter">0 задач</span>
      <button id="clearDone" class="clear-btn">Удалить выполненные</button>
    </footer>
  </div>

  <script>
    /* ================= ЛОГИКА (JavaScript) ================= */
    let tasks = [];
    let currentFilter = 'all';

    const form = document.getElementById('addForm');
    const input = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    const counter = document.getElementById('counter');
    const clearDoneBtn = document.getElementById('clearDone');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function loadTasks() {
      const saved = localStorage.getItem('tasks');
      if (saved) tasks = JSON.parse(saved);
    }

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function render() {
      let visible = tasks;
      if (currentFilter === 'active') visible = tasks.filter(t => !t.done);
      else if (currentFilter === 'done') visible = tasks.filter(t => t.done);

      taskList.innerHTML = '';
      if (visible.length === 0) emptyState.classList.remove('hidden');
      else emptyState.classList.add('hidden');

      visible.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => toggleTask(task.id));

        const span = document.createElement('span');
        span.textContent = task.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', () => deleteTask(task.id));

        li.append(checkbox, span, delBtn);
        taskList.appendChild(li);
      });

      const activeCount = tasks.filter(t => !t.done).length;
      counter.textContent = `${activeCount} активных из ${tasks.length}`;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (text === '') return;

      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = '';
      saveTasks();
      render();
      input.focus();
    });

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        saveTasks();
        render();
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      render();
    }

    clearDoneBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.done);
      saveTasks();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    loadTasks();
    render();
  </script>
</body>
</html>
